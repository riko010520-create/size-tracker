# 非公開の size-tracker-voices に入れたボイスとタイトル（同じ日付の .txt）を、前の日の夜に公開側（このリポジトリ）へコピーする
# アプリはその日の朝5時になるまで出さない
name: 応援ボイスを公開

on:
  schedule:
    - cron: '17 10,12,14,16,18 * * *'   # 日本時間 19:17・21:17・23:17・1:17・3:17。GitHubの自動実行は数時間遅れることがあるので、夜のうちに何回か動かして朝5時に間に合わせる
  workflow_dispatch:       # Actions 画面の「Run workflow」で今すぐ実行もできる

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: riko010520-create/size-tracker-voices
          token: ${{ secrets.VOICES_TOKEN }}
          path: _private

      - name: 今日までのボイスをコピー
        id: copy
        run: |
          # 19時以降に動いたときは翌日分まで、夜中（0〜4時台）はその日の分までコピーする
          until=$(TZ=Asia/Tokyo date -d '+5 hours' +%F)
          mkdir -p voices
          shopt -s nullglob nocaseglob
          for f in _private/*.{m4a,mp3,wav,aac,mp4,txt} _private/voices/*.{m4a,mp3,wav,aac,mp4,txt}; do
            name=$(basename "$f")
            d=${name%%.*}
            [[ $d =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || continue
            [[ "$d" > "$until" ]] && continue
            cmp -s "$f" "voices/$name" || { cp "$f" "voices/$name"; echo "公開: $name"; }   # 新しいもの・中身が変わったものだけ
          done
          rm -rf _private
          git add voices
          if git diff --cached --quiet; then
            echo "新しく公開するボイスはありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish voices up to $until"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: サイトを更新
        if: steps.copy.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || true

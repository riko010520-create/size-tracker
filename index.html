<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="お腹痩せ記録">
<meta name="theme-color" content="#FDF6EC">
<title>お腹痩せ記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FDF6EC;
    --card: #FFFFFF;
    --cream: #FDF0E2;
    --peach: #F7B88E;
    --peach-deep: #EE9E6C;
    --peach-soft: #FCE3D1;
    --yellow: #F7CF6A;
    --yellow-deep: #E9B443;
    --yellow-soft: #FCEDC2;
    --text: #4A3B33;
    --text-soft: #8A6B57;
    --muted: #A8968A;
    --line: #F0E2D4;
    --shadow: 0 6px 18px rgba(214, 150, 110, .16);
    --radius: 22px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", -apple-system, sans-serif;
    min-height: 100vh;
  }
  button { font-family: inherit; color: inherit; border: none; background: none; cursor: pointer; }
  .app { max-width: 480px; margin: 0 auto; padding: 0 16px calc(110px + env(safe-area-inset-bottom)); }

  header { padding: calc(18px + env(safe-area-inset-top)) 4px 8px; display: flex; align-items: flex-end; justify-content: space-between; }
  header .sub { font-size: 12px; color: var(--muted); letter-spacing: .12em; font-weight: 700; }
  header h1 { margin: 2px 0 0; font-size: 26px; font-weight: 800; }
  .streak { background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 700; box-shadow: var(--shadow); white-space: nowrap; }
  .streak b { color: var(--peach-deep); font-size: 17px; }

  .view { display: none; }
  .view.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { transform: translateY(6px); } to { transform: none; } }

  /* week tags */
  .week { background: var(--card); border-radius: var(--radius); padding: 14px 10px 16px; box-shadow: var(--shadow); margin-top: 10px; }
  .week-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 10px; }
  .week-head span { font-weight: 800; font-size: 15px; }
  .arrow { width: 32px; height: 32px; border-radius: 50%; background: var(--cream); font-size: 16px; font-weight: 800; color: var(--peach-deep); }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .day .dow { font-size: 11px; color: var(--muted); font-weight: 700; }
  .day.sat .dow { color: #6FA9C9; }
  .day.sun .dow { color: #E0805A; }
  .tag { width: 100%; max-width: 46px; aspect-ratio: 1 / 1.05; border-radius: 14px; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; position: relative; transition: transform .15s; }
  .tag:active { transform: scale(.94); }
  .tag.today { outline: 2px solid var(--peach); outline-offset: -2px; }
  .tag.done { background: var(--yellow-soft); }
  .tag.selected { background: var(--peach); color: #fff; box-shadow: 0 6px 14px rgba(238, 158, 108, .3); }
  .tag .mark { font-size: 10px; line-height: 1; margin-top: 2px; height: 10px; }
  .tag.future { opacity: .45; }

  /* stamp card */
  .stamp-card { margin-top: 16px; border-radius: var(--radius); padding: 20px; background: linear-gradient(135deg, #FCE3CF 0%, #FBEFC9 100%); box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; }
  .stamp-btn { flex: none; width: 96px; height: 96px; border-radius: 50%; background: #fff; border: 3px dashed var(--peach); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: var(--peach-deep); transition: transform .2s; }
  .stamp-btn .ico { font-size: 30px; line-height: 1.1; }
  .stamp-btn.on { border: 4px solid var(--peach-deep); background: var(--peach); color: #fff; transform: rotate(-10deg); animation: pop .35s ease; }
  .flame { position: fixed; z-index: 30; font-size: 26px; pointer-events: none; transform: translate(-50%, -50%); animation: flame 1.1s ease-out forwards; }
  @keyframes flame {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.25); }
  }
  @keyframes pop { 0% { transform: scale(.6) rotate(-30deg); } 70% { transform: scale(1.12) rotate(-6deg); } 100% { transform: scale(1) rotate(-10deg); } }
  .stamp-text .date { font-size: 13px; color: var(--muted); font-weight: 700; }
  .stamp-text .msg { font-size: 18px; font-weight: 800; margin-top: 4px; line-height: 1.4; }
  .stamp-text .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .pick-btn { margin-top: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.7); font-size: 12px; font-weight: 700; color: var(--peach-deep); }
  .picker { margin-top: 10px; background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); display: none; }
  .picker.open { display: block; animation: fade .2s ease; }
  .picker .ttl { font-size: 13px; font-weight: 800; margin-bottom: 10px; }
  .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .emoji-grid button { aspect-ratio: 1; border-radius: 14px; background: var(--cream); font-size: 24px; }
  .emoji-grid button.sel { background: var(--peach-soft); outline: 2px solid var(--peach); outline-offset: -2px; }
  .own { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  .own input { flex: 1; min-width: 0; border: none; outline: none; background: var(--cream); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 16px; color: var(--text); }
  .own button { padding: 10px 14px; border-radius: 12px; background: var(--peach); color: #fff; font-size: 13px; font-weight: 800; }

  .section-title { display: flex; align-items: center; justify-content: space-between; margin: 22px 4px 10px; }
  .section-title h2 { font-size: 17px; margin: 0; font-weight: 800; }
  .section-title small { font-size: 12px; color: var(--muted); font-weight: 700; }

  /* metric cards */
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .metric { border-radius: 18px; padding: 14px 14px 12px; color: var(--text-soft); position: relative; overflow: hidden; min-height: 92px; text-align: left; }
  .metric .name { font-size: 12px; font-weight: 700; opacity: .95; }
  .metric .val { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .metric .val small { font-size: 12px; margin-left: 2px; }
  .metric .diff { font-size: 11px; font-weight: 700; background: rgba(255,255,255,.5); display: inline-block; padding: 2px 8px; border-radius: 999px; margin-top: 4px; }
  .metric.empty .val { opacity: .7; }
  .metric::after { content: ""; position: absolute; right: -18px; bottom: -18px; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .m-weight { background: linear-gradient(135deg, #F7B88E, #F7CF6A); grid-column: span 2; }
  .m-underbust { background: linear-gradient(135deg, #EDB54A, #F5CD6A); }
  .m-waist { background: linear-gradient(135deg, #F4AA7C, #F7C493); }
  .m-kubire { background: linear-gradient(135deg, #F1A86F, #F5BE6A); }
  .m-lowerBelly { background: linear-gradient(135deg, #EFB85C, #F6D07E); }
  .m-hip { background: linear-gradient(135deg, #F6C27A, #F4AE86); grid-column: span 2; }

  .primary { display: block; width: 100%; margin-top: 14px; padding: 16px; border-radius: 18px; background: var(--peach); color: var(--text-soft); font-size: 16px; font-weight: 800; box-shadow: 0 8px 18px rgba(238, 158, 108, .28); }
  .primary:active { transform: scale(.98); }
  .memo-box { margin-top: 12px; background: var(--card); border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.6; box-shadow: var(--shadow); }
  .memo-box b { color: var(--peach-deep); font-size: 12px; }

  /* calendar */
  .cal { background: var(--card); border-radius: var(--radius); padding: 16px 12px; box-shadow: var(--shadow); margin-top: 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .dow { font-size: 11px; color: var(--muted); font-weight: 700; padding: 4px 0 8px; }
  .cal-grid .dow:first-child { color: #E0805A; }
  .cal-grid .dow:last-child { color: #6FA9C9; }
  .cell { aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; position: relative; }
  .cell.blank { visibility: hidden; }
  .cell.today { outline: 2px solid var(--peach); outline-offset: -2px; }
  .cell.done { background: var(--yellow-soft); }
  .cell.done .n { position: absolute; top: 2px; left: 5px; font-size: 9px; color: #B7862A; }
  .cell .stamp { width: 78%; aspect-ratio: 1; border-radius: 50%; background: var(--peach); border: 2px solid #fff; box-shadow: 0 0 0 1.5px var(--peach-deep); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; font-size: 6.5px; font-weight: 800; letter-spacing: .04em; transform: rotate(-12deg); margin-top: 3px; }
  .cell .stamp b { font-size: 13px; margin-bottom: 1px; font-weight: 400; }
  .cell .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--yellow-deep); margin-top: 2px; }
  .cell.done .dot { position: absolute; bottom: 3px; right: 4px; margin: 0; }
  .cal-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .sum { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .sum .lbl { font-size: 12px; color: var(--muted); font-weight: 700; }
  .sum .num { font-size: 26px; font-weight: 800; color: var(--peach-deep); }
  .sum .num small { font-size: 13px; color: var(--text); }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); font-weight: 700; margin: 12px 4px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }

  /* graph */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 9px 16px; border-radius: 999px; background: var(--card); font-size: 13px; font-weight: 700; box-shadow: var(--shadow); }
  .chip.active { background: var(--peach); color: #fff; }
  .chart-card { background: var(--card); border-radius: var(--radius); padding: 16px 12px 10px; box-shadow: var(--shadow); margin-top: 12px; }
  .chart-card:first-child { margin-top: 6px; }
  .chart-head { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 6px 6px; }
  .chart-head .big { font-size: 28px; font-weight: 800; }
  .chart-head .big small { font-size: 13px; }
  .badge { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--yellow-soft); color: #B7862A; }
  .badge.up { background: var(--peach-soft); color: #C9734C; }
  .legend-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 4px 8px; }
  .lchip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--cream); font-size: 11px; font-weight: 700; }
  .lchip i, .all-row i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .lchip.off { opacity: .35; }
  .all-rows { margin-top: 6px; border-top: 1px solid var(--line); padding: 4px 6px 2px; }
  .all-row { display: grid; grid-template-columns: 14px 1fr 70px 80px; align-items: center; gap: 6px; padding: 7px 0; font-size: 13px; font-weight: 700; }
  .all-row b { text-align: right; }
  .all-row em { font-style: normal; text-align: right; color: #B7862A; }
  .all-row em.up { color: #C9734C; }
  .all-row.hd { font-size: 10px; color: var(--muted); padding: 4px 0 0; }
  .all-row.hd em { color: var(--muted); }
  .all-row.off { opacity: .4; }
  svg text { font-family: inherit; }
  .empty-chart { text-align: center; color: var(--muted); font-size: 13px; padding: 50px 10px; line-height: 1.7; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .table-wrap { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; padding: 6px 4px; }
  th, td { padding: 9px 6px; text-align: center; white-space: nowrap; }
  th { color: var(--muted); font-weight: 700; font-size: 11px; }
  tbody tr { border-top: 1px solid var(--line); }
  tbody tr:active { background: var(--cream); }
  .backup { display: flex; gap: 8px; margin-top: 18px; }
  .ghost { flex: 1; padding: 12px; border-radius: 14px; background: var(--card); font-size: 13px; font-weight: 700; box-shadow: var(--shadow); color: var(--peach-deep); }
  .note { font-size: 11px; color: var(--muted); line-height: 1.7; margin: 10px 4px 0; }

  /* bottom nav */
  nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 480px; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-radius: 26px 26px 0 0; box-shadow: 0 -6px 20px rgba(214,150,110,.15); display: grid; grid-template-columns: 1fr 1fr 80px 1fr 1fr; align-items: center; padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); z-index: 10; }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  nav button svg { width: 24px; height: 24px; }
  nav button.active { color: var(--peach-deep); }
  .fab { width: 60px; height: 60px; border-radius: 50%; background: var(--peach); color: #fff; font-size: 30px; font-weight: 400; margin: -34px auto 0; box-shadow: 0 8px 18px rgba(238,158,108,.4); display: flex !important; align-items: center; justify-content: center; }

  /* sheet */
  .overlay { position: fixed; inset: 0; background: rgba(74,59,51,.35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 20; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 28px 28px 0 0; z-index: 21; transition: transform .3s ease; }
  .sheet.open { transform: translate(-50%, 0); }
  .sheet-top { background: var(--peach); color: #fff; padding: 18px 20px 34px; border-radius: 28px 28px 0 0; }
  .sheet-top .close { background: rgba(255,255,255,.25); color: #fff; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .sheet-top h3 { margin: 14px 0 0; font-size: 22px; font-weight: 800; }
  .sheet-body { background: var(--bg); margin-top: -20px; border-radius: 24px 24px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 6px; }
  .field label small { color: var(--muted); font-weight: 700; margin-left: 4px; }
  .input-wrap { display: flex; align-items: center; background: var(--card); border-radius: 14px; padding: 0 14px; box-shadow: 0 2px 8px rgba(214,150,110,.1); }
  .input-wrap input, .input-wrap textarea { flex: 1; border: none; outline: none; background: none; font: inherit; font-size: 17px; font-weight: 700; padding: 13px 0; color: var(--text); width: 100%; }
  .input-wrap textarea { font-size: 14px; font-weight: 500; resize: none; min-height: 64px; }
  .input-wrap .unit { color: var(--muted); font-weight: 700; font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .row-btns { display: flex; gap: 10px; margin-top: 8px; }
  .row-btns .primary { margin: 0; flex: 2; }
  .danger { flex: 1; border-radius: 18px; background: #fff; color: #C9734C; font-weight: 700; font-size: 14px; }
  .toast { position: fixed; left: 50%; top: calc(20px + env(safe-area-inset-top)); transform: translate(-50%, -80px); background: var(--text); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; transition: transform .3s; z-index: 40; white-space: nowrap; }
  .toast.show { transform: translate(-50%, 0); }

  /* voice */
  .voice-card { margin-top: 16px; background: var(--card); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
  .voice-card .who { width: 46px; height: 46px; flex: none; border-radius: 50%; background: linear-gradient(135deg, var(--peach), var(--yellow)); display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .voice-card .info { flex: 1; min-width: 0; }
  .voice-card .ttl { font-size: 14px; font-weight: 800; }
  .voice-card .st { font-size: 11px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .bar { height: 5px; border-radius: 999px; background: var(--yellow-soft); margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--peach-deep); border-radius: inherit; }
  .play { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--peach); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 14px rgba(238, 158, 108, .3); }
  .play svg { width: 18px; height: 18px; }
  .play:disabled { background: var(--line); box-shadow: none; }
  .voice-hero { margin-top: 10px; border-radius: var(--radius); padding: 20px; background: linear-gradient(135deg, #FCE3CF 0%, #FBEFC9 100%); box-shadow: var(--shadow); }
  .voice-hero h2 { margin: 0; font-size: 19px; font-weight: 800; }
  .voice-hero p { margin: 6px 0 0; font-size: 13px; line-height: 1.6; color: #7A665A; }
  .voice-list .voice-card { margin-top: 10px; }
  .voice-card.today-voice { outline: 2px solid var(--peach); outline-offset: -2px; }
  .empty-voice { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 10px; line-height: 1.7; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="sub">BELLY BOOTCAMP</div>
      <h1 id="title">お腹痩せ記録</h1>
    </div>
    <div class="streak">連続 <b id="streak">0</b> 日🔥</div>
  </header>

  <!-- ホーム -->
  <section class="view active" id="view-home">
    <div class="week">
      <div class="week-head">
        <button class="arrow" id="prevWeek" aria-label="前の週">‹</button>
        <span id="weekLabel"></span>
        <button class="arrow" id="nextWeek" aria-label="次の週">›</button>
      </div>
      <div class="days" id="days"></div>
    </div>

    <div id="homeVoice"></div>

    <div class="stamp-card">
      <button class="stamp-btn" id="stampBtn"></button>
      <div class="stamp-text">
        <div class="date" id="stampDate"></div>
        <div class="msg" id="stampMsg"></div>
        <div class="hint" id="stampHint"></div>
        <button class="pick-btn" id="pickBtn">スタンプを選ぶ ›</button>
      </div>
    </div>

    <div class="picker" id="picker">
      <div class="ttl">好きなスタンプを選んでね</div>
      <div class="emoji-grid" id="emojiGrid"></div>
      <div class="own"><input id="ownEmoji" maxlength="8" placeholder="ほかの絵文字を入力"><button id="ownBtn">決定</button></div>
    </div>

    <div class="section-title">
      <h2>この日のサイズ</h2>
      <small>最初の記録からの変化</small>
    </div>
    <div class="metrics" id="metrics"></div>
    <div id="memoArea"></div>
    <button class="primary" id="recordBtn">この日のサイズを記録する</button>
  </section>

  <!-- カレンダー -->
  <section class="view" id="view-cal">
    <div class="cal">
      <div class="week-head">
        <button class="arrow" id="prevMonth" aria-label="前の月">‹</button>
        <span id="monthLabel"></span>
        <button class="arrow" id="nextMonth" aria-label="次の月">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="legend">
        <span><i style="background:var(--peach);border-radius:50%"></i>スタンプ（動いた日）</span>
        <span><i style="background:var(--yellow-deep);border-radius:50%"></i>サイズを記録した日</span>
      </div>
    </div>
    <div class="cal-summary">
      <div class="sum"><div class="lbl">今月動いた日</div><div class="num" id="monthCount">0<small> 日</small></div></div>
      <div class="sum"><div class="lbl">これまでの合計</div><div class="num" id="totalCount">0<small> 日</small></div></div>
    </div>
    <p class="note">日付をタップすると、その日のページを開けます。</p>
  </section>

  <!-- グラフ -->
  <section class="view" id="view-graph">
    <div class="chips" id="chips"></div>
    <div id="charts"></div>

    <div class="section-title"><h2>記録一覧</h2><small>タップで編集</small></div>
    <div class="table-wrap"><table id="table"></table></div>

    <div class="backup">
      <button class="ghost" id="exportBtn">バックアップを保存</button>
      <button class="ghost" id="importBtn">バックアップから戻す</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="note">記録はこのスマホ（ブラウザ）の中だけに保存され、ほかの人には見えません。機種変更の前は「バックアップを保存」をしておいてね。</p>
  </section>

  <!-- ボイス -->
  <section class="view" id="view-voice">
    <div class="voice-hero">
      <h2>aikoからの朝の応援ボイス📣</h2>
      <p>毎朝ここに届くよ。聞いたら、今日も10分だけ動いてみよう🔥</p>
    </div>
    <div class="section-title"><h2>これまでのボイス</h2><small id="voiceCount"></small></div>
    <div class="voice-list" id="voiceList"></div>
  </section>
  <audio id="audio" preload="none"></audio>
</div>

<nav>
  <button class="active" data-view="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム
  </button>
  <button data-view="cal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>カレンダー
  </button>
  <button class="fab" id="fab" aria-label="記録する">＋</button>
  <button data-view="graph">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-4 3 3 5-6"/></svg>グラフ
  </button>
  <button data-view="voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="2"/><rect x="17" y="14" width="4" height="6" rx="2"/></svg>ボイス
  </button>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-top">
    <button class="close" id="closeSheet">✕ 閉じる</button>
    <h3 id="sheetTitle">サイズを記録</h3>
  </div>
  <div class="sheet-body">
    <form id="form">
      <div class="field">
        <label>日付</label>
        <div class="input-wrap"><input type="date" id="f-date" required></div>
      </div>
      <div class="field">
        <label>体重</label>
        <div class="input-wrap"><input type="number" inputmode="decimal" step="0.1" min="0" id="f-weight" placeholder="--"><span class="unit">kg</span></div>
      </div>
      <div class="grid2" id="sizeFields"></div>
      <div class="field">
        <label>メモ<small>（任意）</small></label>
        <div class="input-wrap"><textarea id="f-memo" placeholder="体調、食事、気づいたことなど"></textarea></div>
      </div>
      <div class="row-btns">
        <button type="button" class="danger" id="deleteBtn">削除</button>
        <button type="submit" class="primary">保存する</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const METRICS = [
  { key: 'weight', name: '体重', unit: 'kg' },
  { key: 'underbust', name: '胸下', unit: 'cm' },
  { key: 'waist', name: '腹囲', unit: 'cm' },
  { key: 'kubire', name: 'くびれ', unit: 'cm' },
  { key: 'lowerBelly', name: '下腹', unit: 'cm' },
  { key: 'hip', name: 'ヒップ', unit: 'cm' },
];
const CHART_COLORS = { weight: '#EE9E6C', underbust: '#E2A93A', waist: '#EE9E6C', kubire: '#E2A93A', lowerBelly: '#EE9E6C', hip: '#E2A93A' };
const DOW = ['日', '月', '火', '水', '木', '金', '土'];
const STORE_KEY = 'aiko-belly-log-v1';
const STAMP_CHOICES = ['👗', '👖', '👚', '👙', '🩱', '🩳', '🥻', '👠', '🩰', '👟', '💃', '🧘‍♀️', '🤸‍♀️', '🏃‍♀️', '💪'];
const DEFAULT_STAMP = '👟';

let data = load();
const today = ymd(new Date());
let selected = today;
let calMonth = new Date();
calMonth.setDate(1);
let chartMetric = 'all';

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY));
    if (d && d.records && d.stamps) return d;
  } catch (e) {}
  return migrateOld() || { records: {}, stamps: {} };
}
// 以前のサイズログ（同じURL）の記録を引き継ぐ
function migrateOld() {
  try {
    const old = JSON.parse(localStorage.getItem('sizelog_entries_v1'));
    if (!old || typeof old !== 'object') return null;
    const map = { chestUnder: 'underbust', waist: 'waist', curve: 'kubire', lowerAbdomen: 'lowerBelly', hip: 'hip' };
    const records = {};
    Object.keys(old).forEach(ds => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(ds) || !old[ds]) return;
      const rec = {};
      Object.keys(map).forEach(k => {
        const v = parseFloat(old[ds][k]);
        if (!isNaN(v) && v > 0) rec[map[k]] = v;
      });
      if (old[ds].note) rec.memo = String(old[ds].note);
      if (Object.keys(rec).length) records[ds] = rec;
    });
    if (!Object.keys(records).length) return null;
    const d = { records, stamps: {} };
    localStorage.setItem(STORE_KEY, JSON.stringify(d));
    return d;
  } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }
  catch (e) { toast('保存できませんでした（プライベートモードかも）'); }
}
function ymd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
function jpDate(s) { const d = parse(s); return `${d.getMonth() + 1}月${d.getDate()}日（${DOW[d.getDay()]}）`; }
function fmt(v) { return Number.isInteger(v) ? v.toFixed(1) : (Math.round(v * 10) / 10).toFixed(1); }
function sortedDates() { return Object.keys(data.records).sort(); }
function firstValue(key) {
  for (const d of sortedDates()) { const v = data.records[d][key]; if (v != null) return { date: d, v }; }
  return null;
}
function latestValue(key, upTo) {
  const ds = sortedDates().filter(d => !upTo || d <= upTo).reverse();
  for (const d of ds) { const v = data.records[d][key]; if (v != null) return { date: d, v }; }
  return null;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}

function streak() {
  let n = 0, d = data.stamps[today] ? today : addDays(today, -1);
  while (data.stamps[d]) { n++; d = addDays(d, -1); }
  return n;
}

/* ---------- home ---------- */
function weekStart(s) { const d = parse(s); const off = (d.getDay() + 6) % 7; d.setDate(d.getDate() - off); return ymd(d); }

function renderWeek() {
  const start = weekStart(selected);
  const s = parse(start), e = parse(addDays(start, 6));
  document.getElementById('weekLabel').textContent =
    `${s.getMonth() + 1}/${s.getDate()} 〜 ${e.getMonth() + 1}/${e.getDate()}`;
  const wrap = document.getElementById('days');
  wrap.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const ds = addDays(start, i), d = parse(ds);
    const el = document.createElement('div');
    el.className = 'day' + (d.getDay() === 6 ? ' sat' : d.getDay() === 0 ? ' sun' : '');
    const cls = ['tag'];
    if (ds === today) cls.push('today');
    if (data.stamps[ds]) cls.push('done');
    if (ds === selected) cls.push('selected');
    if (ds > today) cls.push('future');
    const mark = data.stamps[ds] ? '🔥' : data.records[ds] ? '・' : '';
    el.innerHTML = `<span class="dow">${DOW[d.getDay()]}</span><button class="${cls.join(' ')}">${d.getDate()}<span class="mark">${mark}</span></button>`;
    el.querySelector('button').onclick = () => { selected = ds; renderHome(); };
    wrap.appendChild(el);
  }
}

function renderStamp() {
  const on = !!data.stamps[selected];
  const btn = document.getElementById('stampBtn');
  btn.className = 'stamp-btn' + (on ? ' on' : '');
  btn.innerHTML = on ? `<span class="ico">${stampOf(selected)}</span>DONE!` : `<span class="ico">${myStamp()}</span>タップで<br>スタンプ`;
  document.getElementById('pickBtn').style.display = selected > today ? 'none' : '';
  btn.disabled = selected > today;
  document.getElementById('stampDate').textContent = selected === today ? `今日・${jpDate(selected)}` : jpDate(selected);
  const msgs = ['よくがんばりました！', 'えらい！今日も動けたね', 'その10分が未来を変える✨', '自分を大切にできた日🫶'];
  document.getElementById('stampMsg').textContent = selected > today ? 'まだ先の日です'
    : on ? msgs[parse(selected).getDate() % msgs.length] : '今日は動けた？';
  document.getElementById('stampHint').textContent = selected > today ? ''
    : on ? 'もう一度タップで取り消せます' : '10分でも動いたらスタンプを押そう';
}

function renderMetrics() {
  const rec = data.records[selected] || {};
  const wrap = document.getElementById('metrics');
  wrap.innerHTML = METRICS.map(m => {
    const v = rec[m.key];
    const first = firstValue(m.key);
    let diff = '';
    if (v != null && first && first.date < selected) {
      const d = v - first.v;
      diff = `<div class="diff">${d > 0 ? '+' : d < 0 ? '−' : '±'}${fmt(Math.abs(d))}${m.unit}</div>`;
    }
    return `<button class="metric m-${m.key}${v == null ? ' empty' : ''}" data-key="${m.key}">
      <div class="name">${m.name}</div>
      <div class="val">${v == null ? '--' : fmt(v)}<small>${m.unit}</small></div>${diff}</button>`;
  }).join('');
  wrap.querySelectorAll('.metric').forEach(b => b.onclick = () => { chartMetric = b.dataset.key; show('graph'); });
  document.getElementById('memoArea').innerHTML = rec.memo
    ? `<div class="memo-box"><b>メモ</b><br>${escapeHtml(rec.memo).replace(/\n/g, '<br>')}</div>` : '';
  document.getElementById('recordBtn').textContent = data.records[selected] ? 'この日の記録を編集する' : 'この日のサイズを記録する';
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function renderHome() {
  renderWeek(); renderHomeVoice(); renderStamp(); renderMetrics();
  document.getElementById('streak').textContent = streak();
}

// スタンプの絵文字。日ごとに押したときの絵文字を残す（前の版の true は 👟 として扱う）
function myStamp() { return data.stampIcon || DEFAULT_STAMP; }
function stampOf(ds) { const v = data.stamps[ds]; return typeof v === 'string' ? v : DEFAULT_STAMP; }
function setStamp(icon) {
  data.stampIcon = icon;
  if (data.stamps[selected]) data.stamps[selected] = icon;
  save(); document.getElementById('picker').classList.remove('open'); renderAll();
  toast(`スタンプを ${icon} にしました`);
}
function renderPicker() {
  const grid = document.getElementById('emojiGrid');
  grid.innerHTML = STAMP_CHOICES.map(e => `<button class="${e === myStamp() ? 'sel' : ''}">${e}</button>`).join('');
  grid.querySelectorAll('button').forEach(b => b.onclick = () => setStamp(b.textContent));
}
document.getElementById('ownBtn').onclick = () => {
  const v = document.getElementById('ownEmoji').value.trim();
  if (!v) { toast('絵文字を入れてね'); return; }
  // 🧘‍♀️ のような組み合わせ絵文字も1つとして扱う
  const first = window.Intl && Intl.Segmenter ? [...new Intl.Segmenter('ja', { granularity: 'grapheme' }).segment(v)][0].segment : [...v][0];
  setStamp(first);
  document.getElementById('ownEmoji').value = '';
};

function toggleStamp(ds) {
  if (ds > today) return;
  if (data.stamps[ds]) { delete data.stamps[ds]; toast('スタンプを取り消しました'); }
  else { data.stamps[ds] = myStamp(); toast(`スタンプを押しました${myStamp()}`); flameBurst(); }
  save(); renderAll();
}

// スタンプを押した瞬間に、ボタンのまわりから🔥が飛び出す
function flameBurst() {
  const r = document.getElementById('stampBtn').getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 10; i++) {
    const f = document.createElement('span');
    const ang = -Math.PI / 2 + (i / 9 - .5) * Math.PI * 1.3;
    const dist = 70 + Math.random() * 50;
    f.className = 'flame';
    f.textContent = '🔥';
    f.style.left = cx + 'px'; f.style.top = cy + 'px';
    f.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    f.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
    f.style.animationDelay = Math.random() * .15 + 's';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1400);
  }
}

/* ---------- calendar ---------- */
function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  document.getElementById('monthLabel').textContent = `${y}年 ${m + 1}月`;
  const grid = document.getElementById('calGrid');
  let html = DOW.map(d => `<div class="dow">${d}</div>`).join('');
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  for (let i = 0; i < first; i++) html += '<div class="cell blank"></div>';
  let count = 0;
  for (let d = 1; d <= days; d++) {
    const ds = ymd(new Date(y, m, d));
    const cls = ['cell'];
    if (ds === today) cls.push('today');
    if (data.stamps[ds]) { cls.push('done'); count++; }
    const stamp = data.stamps[ds] ? `<span class="stamp"><b>${stampOf(ds)}</b>DONE</span>` : '';
    html += `<button class="${cls.join(' ')}" data-d="${ds}"><span class="n">${d}</span>${stamp}${data.records[ds] ? '<span class="dot"></span>' : ''}</button>`;
  }
  grid.innerHTML = html;
  grid.querySelectorAll('button.cell').forEach(b => b.onclick = () => { selected = b.dataset.d; show('home'); });
  document.getElementById('monthCount').innerHTML = `${count}<small> 日</small>`;
  document.getElementById('totalCount').innerHTML = `${Object.keys(data.stamps).length}<small> 日</small>`;
}

/* ---------- graph ---------- */
function renderChips() {
  const wrap = document.getElementById('chips');
  const items = [{ key: 'all', name: 'すべて' }, ...METRICS];
  wrap.innerHTML = items.map(m => `<button class="chip${m.key === chartMetric ? ' active' : ''}" data-key="${m.key}">${m.name}</button>`).join('');
  wrap.querySelectorAll('.chip').forEach(c => c.onclick = () => { chartMetric = c.dataset.key; renderGraph(); });
}

function chartCard(key) {
  const m = METRICS.find(x => x.key === key);
  const pts = sortedDates().filter(d => data.records[d][m.key] != null).map(d => ({ d, v: data.records[d][m.key] }));
  const head = (latest, badge) => `<div class="chart-head"><div>
      <div style="font-size:12px;color:var(--muted);font-weight:700">${m.name}の変化</div>
      <div class="big">${latest}<small> ${m.unit}</small></div></div>${badge}</div>`;
  if (!pts.length) {
    return `<div class="chart-card">${head('--', '')}<div class="empty-chart">まだ${m.name}の記録がありません。<br>＋ボタンから記録するとグラフになります。</div></div>`;
  }
  const last = pts[pts.length - 1], diff = last.v - pts[0].v;
  const badge = pts.length > 1
    ? `<span class="badge${diff > 0 ? ' up' : ''}">スタートから ${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${fmt(Math.abs(diff))}${m.unit}</span>` : '';

  const W = 340, H = 210, L = 38, R = 14, T = 18, B = 30;
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = Math.max((hi - lo) * 0.2, 0.5); lo -= pad; hi += pad;
  const t0 = parse(pts[0].d).getTime(), t1 = parse(last.d).getTime();
  const x = p => pts.length === 1 ? (L + W - R) / 2 : L + (parse(p.d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const color = CHART_COLORS[m.key];
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(last).toFixed(1)},${H - B} L${x(pts[0]).toFixed(1)},${H - B} Z`;
  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * i / 3, yy = y(v);
    grid += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#F0E2D4" stroke-dasharray="3 4"/>
      <text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#A8968A">${fmt(v)}</text>`;
  }
  const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const showLabels = pts.length <= 8;
  const dots = pts.map((p, i) => {
    const isEnd = i === pts.length - 1;
    return `<circle cx="${x(p)}" cy="${y(p.v)}" r="${isEnd ? 6 : 4}" fill="#fff" stroke="${color}" stroke-width="${isEnd ? 3 : 2.5}"/>` +
      (showLabels || isEnd || i === 0 ? `<text x="${x(p)}" y="${y(p.v) - 10}" text-anchor="middle" font-size="10" font-weight="700" fill="${color}">${fmt(p.v)}</text>` : '');
  }).join('');
  const xl = pts.length === 1 ? `<text x="${x(pts[0])}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#A8968A">${md(pts[0].d)}</text>`
    : `<text x="${L}" y="${H - 8}" font-size="10" fill="#A8968A">${md(pts[0].d)}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="10" fill="#A8968A">${md(last.d)}</text>`;
  return `<div class="chart-card">${head(fmt(last.v), badge)}<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${m.name}のグラフ">
    <defs><linearGradient id="g-${m.key}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}${pts.length > 1 ? `<path d="${area}" fill="url(#g-${m.key})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
    ${dots}${xl}</svg></div>`;
}

// 「すべて」用：1つのグラフに全部の線を重ねる（サイズは左の目盛り、体重は右の目盛り）
const ALL_COLORS = { weight: '#F0A070', underbust: '#E8B53A', waist: '#DE7546', kubire: '#9A6B4F', lowerBelly: '#A9A13A', hip: '#7FA7C0' };
const hiddenLines = new Set();

function allCard() {
  const series = METRICS.map(m => ({ m, pts: sortedDates().filter(d => data.records[d][m.key] != null).map(d => ({ d, v: data.records[d][m.key] })) }));
  const legend = `<div class="legend-chips">${METRICS.map(m =>
    `<button class="lchip${hiddenLines.has(m.key) ? ' off' : ''}" data-key="${m.key}"><i style="background:${ALL_COLORS[m.key]}"></i>${m.name}</button>`).join('')}</div>`;
  const head = `<div class="chart-head"><div><div style="font-size:12px;color:var(--muted);font-weight:700">すべての変化</div>
    <div style="font-size:11px;color:var(--muted);margin-top:2px">左の目盛り：サイズ（cm）／右の目盛り：体重（kg）</div></div></div>`;
  const shown = series.filter(s => s.pts.length && !hiddenLines.has(s.m.key));
  if (!series.some(s => s.pts.length)) {
    return `<div class="chart-card">${head}<div class="empty-chart">まだ記録がありません。<br>＋ボタンから記録するとグラフになります。</div></div>`;
  }

  const W = 340, H = 280, L = 34, R = 34, T = 16, B = 28;
  const dates = [...new Set(shown.flatMap(s => s.pts.map(p => p.d)))].sort();
  const t0 = dates.length ? parse(dates[0]).getTime() : 0, t1 = dates.length ? parse(dates[dates.length - 1]).getTime() : 0;
  const x = d => t1 === t0 ? (L + W - R) / 2 : L + (parse(d).getTime() - t0) / (t1 - t0) * (W - L - R);
  const range = list => {
    const vs = list.flatMap(s => s.pts.map(p => p.v));
    if (!vs.length) return null;
    let lo = Math.min(...vs), hi = Math.max(...vs);
    const pad = Math.max((hi - lo) * 0.12, 0.5);
    return [lo - pad, hi + pad];
  };
  const cm = range(shown.filter(s => s.m.key !== 'weight'));
  const kg = range(shown.filter(s => s.m.key === 'weight'));
  const yOf = r => v => T + (r[1] - v) / (r[1] - r[0]) * (H - T - B);

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const yy = T + (H - T - B) * i / 4;
    grid += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#F0E2D4" stroke-dasharray="3 4"/>`;
    if (cm) grid += `<text x="${L - 5}" y="${yy + 4}" text-anchor="end" font-size="9" fill="#A8968A">${fmt(cm[1] - (cm[1] - cm[0]) * i / 4)}</text>`;
    if (kg) grid += `<text x="${W - R + 5}" y="${yy + 4}" font-size="9" fill="${ALL_COLORS.weight}">${fmt(kg[1] - (kg[1] - kg[0]) * i / 4)}</text>`;
  }
  const lines = shown.map(s => {
    const y = yOf(s.m.key === 'weight' ? kg : cm), c = ALL_COLORS[s.m.key];
    const path = s.pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const dots = s.pts.map(p => `<circle cx="${x(p.d)}" cy="${y(p.v)}" r="3" fill="#fff" stroke="${c}" stroke-width="2"/>`).join('');
    return `<path d="${path}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"${s.m.key === 'weight' ? ' stroke-dasharray="6 4"' : ''}/>${dots}`;
  }).join('');
  const md = s => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const xl = !dates.length ? '' : dates.length === 1
    ? `<text x="${x(dates[0])}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#A8968A">${md(dates[0])}</text>`
    : `<text x="${L}" y="${H - 8}" font-size="10" fill="#A8968A">${md(dates[0])}</text><text x="${W - R}" y="${H - 8}" text-anchor="end" font-size="10" fill="#A8968A">${md(dates[dates.length - 1])}</text>`;

  const rows = series.filter(s => s.pts.length).map(s => {
    const first = s.pts[0].v, last = s.pts[s.pts.length - 1].v, diff = last - first;
    return `<div class="all-row${hiddenLines.has(s.m.key) ? ' off' : ''}"><i style="background:${ALL_COLORS[s.m.key]}"></i><span>${s.m.name}</span>
      <b>${fmt(last)}${s.m.unit}</b><em class="${diff > 0 ? 'up' : ''}">${s.pts.length > 1 ? `${diff > 0 ? '+' : diff < 0 ? '−' : '±'}${fmt(Math.abs(diff))}` : '-'}</em></div>`;
  }).join('');

  return `<div class="chart-card">${head}${legend}
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="すべての変化のグラフ">${grid}${lines}${xl}</svg>
    <div class="all-rows"><div class="all-row hd"><i></i><span></span><b>いま</b><em>スタートから</em></div>${rows}</div></div>`;
}

function renderChart() {
  const box = document.getElementById('charts');
  box.innerHTML = chartMetric === 'all' ? allCard() : chartCard(chartMetric);
  box.querySelectorAll('.lchip').forEach(b => b.onclick = () => {
    const k = b.dataset.key;
    hiddenLines.has(k) ? hiddenLines.delete(k) : hiddenLines.add(k);
    renderChart();
  });
}

function renderTable() {
  const ds = sortedDates().reverse();
  const t = document.getElementById('table');
  if (!ds.length) { t.innerHTML = '<tbody><tr><td style="color:var(--muted);padding:24px">まだ記録がありません</td></tr></tbody>'; return; }
  t.innerHTML = `<thead><tr><th>日付</th>${METRICS.map(m => `<th>${m.name}</th>`).join('')}<th>🔥</th></tr></thead><tbody>` +
    ds.map(d => { const r = data.records[d], dt = parse(d);
      return `<tr data-d="${d}"><td><b>${dt.getMonth() + 1}/${dt.getDate()}</b></td>${METRICS.map(m => `<td>${r[m.key] != null ? fmt(r[m.key]) : '-'}</td>`).join('')}<td>${data.stamps[d] ? stampOf(d) : ''}</td></tr>`;
    }).join('') + '</tbody>';
  t.querySelectorAll('tbody tr[data-d]').forEach(tr => tr.onclick = () => openSheet(tr.dataset.d));
}

function renderGraph() { renderChips(); renderChart(); renderTable(); }

/* ---------- sheet ---------- */
document.getElementById('sizeFields').innerHTML = METRICS.slice(1).map(m =>
  `<div class="field"><label>${m.name}</label><div class="input-wrap"><input type="number" inputmode="decimal" step="0.1" min="0" id="f-${m.key}" placeholder="--"><span class="unit">${m.unit}</span></div></div>`).join('');

function fillForm(ds) {
  const r = data.records[ds] || {};
  document.getElementById('f-date').value = ds;
  METRICS.forEach(m => document.getElementById('f-' + m.key).value = r[m.key] ?? '');
  document.getElementById('f-memo').value = r.memo || '';
  document.getElementById('deleteBtn').style.display = data.records[ds] ? '' : 'none';
  document.getElementById('sheetTitle').textContent = data.records[ds] ? '記録を編集' : 'サイズを記録';
}
function openSheet(ds) {
  fillForm(ds || selected);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
document.getElementById('f-date').onchange = e => { if (e.target.value) fillForm(e.target.value); };
document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const ds = document.getElementById('f-date').value;
  if (!ds) return;
  const rec = {};
  METRICS.forEach(m => {
    const v = parseFloat(document.getElementById('f-' + m.key).value);
    if (!isNaN(v) && v > 0) rec[m.key] = v;
  });
  const memo = document.getElementById('f-memo').value.trim();
  if (memo) rec.memo = memo;
  if (!Object.keys(rec).length) { toast('1つ以上入力してね'); return; }
  data.records[ds] = rec;
  save(); selected = ds; closeSheet(); renderAll(); toast('記録しました✨');
};
document.getElementById('deleteBtn').onclick = () => {
  const ds = document.getElementById('f-date').value;
  if (!confirm(`${jpDate(ds)}の記録を削除しますか？`)) return;
  delete data.records[ds]; save(); closeSheet(); renderAll(); toast('削除しました');
};
document.getElementById('overlay').onclick = closeSheet;
document.getElementById('closeSheet').onclick = closeSheet;

/* ---------- backup ---------- */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `お腹痩せ記録_${today}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('importBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => {
    const d = JSON.parse(txt);
    if (!d.records || !d.stamps) throw new Error();
    if (!confirm('今の記録をバックアップの内容に置き換えますか？')) return;
    data = d; save(); renderAll(); toast('戻しました');
  }).catch(() => toast('このファイルは読み込めませんでした'));
  e.target.value = '';
};

/* ---------- nav ---------- */
function show(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  document.querySelectorAll('nav [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  if (view === 'cal') { calMonth = parse(selected); calMonth.setDate(1); }
  renderAll();
  window.scrollTo(0, 0);
}
document.querySelectorAll('nav [data-view]').forEach(b => b.onclick = () => show(b.dataset.view));
document.getElementById('fab').onclick = () => openSheet(selected);
document.getElementById('recordBtn').onclick = () => openSheet(selected);
document.getElementById('stampBtn').onclick = () => toggleStamp(selected);
document.getElementById('pickBtn').onclick = () => { renderPicker(); document.getElementById('picker').classList.toggle('open'); };
document.getElementById('prevWeek').onclick = () => { selected = addDays(selected, -7); renderHome(); };
document.getElementById('nextWeek').onclick = () => { selected = addDays(selected, 7); renderHome(); };
document.getElementById('prevMonth').onclick = () => { calMonth.setMonth(calMonth.getMonth() - 1); renderCal(); };
document.getElementById('nextMonth').onclick = () => { calMonth.setMonth(calMonth.getMonth() + 1); renderCal(); };

/* ---------- voice ---------- */
// ボイスは GitHub の voices フォルダに「2026-11-12.m4a」のように日付の名前で置く
const VOICE_API = 'https://api.github.com/repos/riko010520-create/size-tracker/contents/voices';
const VOICE_RE = /^(\d{4}-\d{2}-\d{2})\.(m4a|mp3|wav|aac|mp4)$/i;
let voices = {};
let voicesLoaded = false;
let playing = null;
const audio = document.getElementById('audio');
const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.5-6.5a1 1 0 0 0 0-1.8L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>';
const PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>';

async function loadVoices() {
  try {
    const r = await fetch(VOICE_API, { cache: 'no-store' });
    if (r.ok) {
      (await r.json()).forEach(f => {
        const m = f.name.match(VOICE_RE);
        if (m) voices[m[1]] = 'voices/' + encodeURIComponent(f.name);
      });
    }
  } catch (e) {}
  voicesLoaded = true;
  renderHomeVoice(); renderVoiceList(); renderCal();
}

function fmtTime(t) { if (!isFinite(t)) return '0:00'; const s = Math.floor(t); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

function voiceCard(ds, extra) {
  const has = !!voices[ds], on = playing === ds && !audio.paused;
  const st = !has ? (voicesLoaded ? 'まだ届いていません' : '読み込み中…') : playing === ds ? `${fmtTime(audio.currentTime)} / ${fmtTime(audio.duration)}` : 'タップで再生';
  return `<div class="voice-card${extra || ''}" data-voice="${ds}">
    <div class="who">📣</div>
    <div class="info"><div class="ttl">aikoからの応援ボイス</div><div class="st">${ds === today ? '今日' : jpDate(ds)}・${st}</div>
      <div class="bar"><i style="width:${playing === ds && audio.duration ? audio.currentTime / audio.duration * 100 : 0}%"></i></div></div>
    <button class="play" ${has ? '' : 'disabled'} aria-label="再生">${on ? PAUSE_ICON : PLAY_ICON}</button></div>`;
}
function bindVoice(root) {
  root.querySelectorAll('[data-voice] .play').forEach(b => b.onclick = () => togglePlay(b.closest('[data-voice]').dataset.voice));
}
function renderHomeVoice() {
  const el = document.getElementById('homeVoice');
  if (selected > today) { el.innerHTML = ''; return; }
  el.innerHTML = voiceCard(selected);
  bindVoice(el);
}
function renderVoiceList() {
  const ds = Object.keys(voices).filter(d => d <= today).sort().reverse();
  document.getElementById('voiceCount').textContent = ds.length ? `${ds.length}件` : '';
  const el = document.getElementById('voiceList');
  el.innerHTML = ds.length ? ds.map(d => voiceCard(d, d === today ? ' today-voice' : '')).join('')
    : `<div class="empty-voice">${voicesLoaded ? 'まだボイスは届いていません。<br>届いたらここに並びます🎧' : '読み込み中…'}</div>`;
  bindVoice(el);
}
function togglePlay(ds) {
  if (playing === ds && !audio.paused) { audio.pause(); return; }
  if (playing !== ds) { audio.src = voices[ds]; playing = ds; }
  audio.play().catch(() => toast('再生できませんでした'));
}
function refreshVoiceUI() { renderHomeVoice(); renderVoiceList(); }
['play', 'pause', 'timeupdate', 'loadedmetadata', 'ended'].forEach(ev => audio.addEventListener(ev, refreshVoiceUI));
audio.addEventListener('error', () => { if (playing) { toast('ボイスを読み込めませんでした'); playing = null; refreshVoiceUI(); } });

function renderAll() { renderHome(); renderCal(); renderGraph(); renderVoiceList(); }
renderAll();
loadVoices();
</script>
</body>

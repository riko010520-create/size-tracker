<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>サイズログ</title>
<style>
/* layout: tape-measure header, entry card with tick-marked fields, line chart with toggle legend, history list doubling as the table view */
:root{
  --bg:#f6f1ef; --surface:#ffffff; --surface-2:#fbf6f3;
  --ink:#2a2024; --ink-soft:#6e5f65; --muted:#96878c; --line:#e7dfdd;
  --accent:#9c3b58; --accent-strong:#7c2c44; --accent-soft:#f3dde3; --danger:#b23a3a;
  --chart-grid:#e1e0d9; --chart-muted:#898781;
  --s-chestUnder:#2a78d6; --s-waist:#eb6834; --s-curve:#1baf7a; --s-lowerAbdomen:#eda100; --s-hip:#e87ba4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1517; --surface:#221b1e; --surface-2:#291f23;
    --ink:#f6eff1; --ink-soft:#c7b9bd; --muted:#8f8285; --line:#3a3033;
    --accent:#e08aa1; --accent-strong:#eda9bb; --accent-soft:#3a2530; --danger:#e08585;
    --chart-grid:#2c2c2a; --chart-muted:#898781;
    --s-chestUnder:#3987e5; --s-waist:#d95926; --s-curve:#199e70; --s-lowerAbdomen:#c98500; --s-hip:#d55181;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1517; --surface:#221b1e; --surface-2:#291f23;
  --ink:#f6eff1; --ink-soft:#c7b9bd; --muted:#8f8285; --line:#3a3033;
  --accent:#e08aa1; --accent-strong:#eda9bb; --accent-soft:#3a2530; --danger:#e08585;
  --chart-grid:#2c2c2a; --chart-muted:#898781;
  --s-chestUnder:#3987e5; --s-waist:#d95926; --s-curve:#199e70; --s-lowerAbdomen:#c98500; --s-hip:#d55181;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Karla',-apple-system,'Segoe UI',sans-serif;
  padding-inline:16px;
  padding-block:calc(24px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.wrap{max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:20px;}

h1,h2,h3{font-family:'Fraunces',Georgia,'Times New Roman',serif; font-weight:600; margin:0; text-wrap:balance;}
h1{font-size:1.7rem; letter-spacing:.2px;}
h2{font-size:1.05rem; color:var(--ink);}

.eyebrow{font-size:.72rem; letter-spacing:.09em; color:var(--muted); text-transform:uppercase; margin:0 0 4px;}
.tape{
  height:6px; border-radius:3px; margin-top:10px;
  background:repeating-linear-gradient(90deg, var(--accent) 0 2px, transparent 2px 10px);
  opacity:.55;
}

header.top{padding-top:2px;}
.today{font-size:.85rem; color:var(--ink-soft); margin-top:4px;}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:16px;
  padding:18px; box-shadow:0 1px 2px rgba(0,0,0,.03);
}

/* stat row */
.stats{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
@media(min-width:480px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));}}
.stat{
  background:var(--surface-2); border-radius:12px; padding:10px 12px; min-width:0;
}
.stat .label{font-size:.72rem; color:var(--muted); display:flex; align-items:center; gap:6px;}
.stat .dot{width:8px; height:8px; border-radius:50%; flex:none;}
.stat .value{font-family:'Fraunces',serif; font-size:1.25rem; font-variant-numeric:tabular-nums; margin-top:2px;}
.stat .value .unit{font-family:'Karla',sans-serif; font-size:.7rem; color:var(--muted); margin-left:2px;}
.stat .delta{font-size:.72rem; margin-top:2px; color:var(--muted); font-variant-numeric:tabular-nums;}
.empty-stats{color:var(--muted); font-size:.85rem;}

/* form */
form{display:flex; flex-direction:column; gap:14px;}
.row{display:flex; flex-direction:column; gap:6px;}
.row label{font-size:.78rem; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:baseline;}
input[type="date"], input[type="text"]{
  font-family:'Karla',sans-serif; font-size:.95rem; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  padding:9px 11px; width:100%;
}
.grid5{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
@media(min-width:420px){.grid5{grid-template-columns:repeat(3,minmax(0,1fr));}}
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field .fieldlabel{font-size:.78rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
.field .fieldlabel .dot{width:7px;height:7px;border-radius:50%;flex:none;}
.inputline{position:relative;}
.inputline input[type="number"]{
  font-family:'Karla',sans-serif; font-variant-numeric:tabular-nums; font-size:1rem; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
  padding:9px 34px 9px 11px; width:100%; -moz-appearance:textfield;
}
.inputline input[type=number]::-webkit-outer-spin-button,
.inputline input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
.inputline .unit{position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:.75rem; color:var(--muted);}
input:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

.editing-note{font-size:.78rem; color:var(--accent-strong); background:var(--accent-soft); border-radius:8px; padding:6px 10px; display:none;}
.editing-note.show{display:block;}

button.primary{
  font-family:'Karla',sans-serif; font-weight:700; font-size:.95rem; color:#fff;
  background:var(--accent); border:none; border-radius:10px; padding:11px 16px; cursor:pointer;
}
button.primary:disabled{opacity:.5; cursor:not-allowed;}
button.primary:hover:not(:disabled){background:var(--accent-strong);}
.form-msg{font-size:.8rem; color:var(--danger); min-height:1em;}
.toast{font-size:.8rem; color:var(--accent-strong); min-height:1em;}

/* legend */
.legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.chip{
  display:flex; align-items:center; gap:6px; font-size:.78rem; color:var(--ink-soft);
  background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:5px 10px 5px 8px;
  cursor:pointer; user-select:none;
}
.chip .dot{width:9px; height:9px; border-radius:50%; flex:none;}
.chip[aria-pressed="false"]{opacity:.4;}
.chip[aria-pressed="false"] .dot{background:var(--muted) !important;}

.chart-wrap{position:relative;}
.chart-wrap svg{display:block; width:100%; height:auto; touch-action:none;}
.chart-empty{color:var(--muted); font-size:.85rem; padding:20px 4px;}
.tooltip{
  position:absolute; pointer-events:none; background:var(--ink); color:var(--bg);
  border-radius:8px; padding:8px 10px; font-size:.74rem; line-height:1.5;
  box-shadow:0 4px 12px rgba(0,0,0,.18); opacity:0; transition:opacity .1s; z-index:2;
  transform:translate(-50%,-100%); white-space:nowrap;
}
.tooltip .t-date{color:var(--bg); opacity:.7; margin-bottom:2px; font-variant-numeric:tabular-nums;}
.tooltip .t-row{display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums;}
.tooltip .t-row .dot{width:7px;height:7px;border-radius:50%;flex:none;}

/* history */
.history-list{display:flex; flex-direction:column; gap:0;}
.entry{
  display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line);
}
.entry:last-child{border-bottom:none;}
.entry .edate{width:64px; flex:none; font-size:.82rem; color:var(--ink-soft); font-variant-numeric:tabular-nums;}
.entry .evals{flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:8px 12px; font-size:.82rem;}
.entry .evals span{display:flex; align-items:baseline; gap:4px; font-variant-numeric:tabular-nums;}
.entry .evals .k{color:var(--muted); font-size:.7rem;}
.entry .enote{width:100%; font-size:.76rem; color:var(--muted); margin-top:2px;}
.entry .edel{flex:none; background:none; border:none; color:var(--muted); cursor:pointer; font-size:.78rem; padding:4px 6px;}
.entry .edel:hover{color:var(--danger);}
.confirm-row{display:none; gap:8px; align-items:center; padding:6px 2px 10px; font-size:.78rem; color:var(--ink-soft);}
.confirm-row.show{display:flex;}
.confirm-row button{font-size:.78rem; border-radius:8px; padding:5px 10px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); cursor:pointer;}
.confirm-row button.yes{color:#fff; background:var(--danger); border-color:var(--danger);}

.banner{font-size:.8rem; color:var(--ink-soft); background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
.empty-history{color:var(--muted); font-size:.88rem; padding:6px 2px;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">Body Measurements</p>
    <h1>サイズログ</h1>
    <p class="today" id="whoLine">あなたの記録（この端末に保存されます）</p>
    <p class="today" id="todayLine"></p>
    <div class="tape" aria-hidden="true"></div>
  </header>

  <div id="storageBanner" class="banner" hidden></div>

  <section class="card" id="statsCard">
    <h2 style="margin-bottom:10px;">最新の記録</h2>
    <div id="statsBody"></div>
  </section>

  <section class="card">
    <h2>記録する</h2>
    <form id="entryForm" style="margin-top:12px;">
      <div class="row">
        <label for="dateInput">日付</label>
        <input type="date" id="dateInput" required>
      </div>
      <div class="editing-note" id="editingNote">この日の記録を編集しています。保存すると上書きされます。</div>
      <div class="grid5" id="fieldsGrid"></div>
      <div class="row">
        <label for="noteInput">メモ（任意）</label>
        <input type="text" id="noteInput" placeholder="生理前でむくみ、など">
      </div>
      <div class="form-msg" id="formMsg" role="alert"></div>
      <div class="toast" id="formToast"></div>
      <button type="submit" class="primary" id="saveBtn">記録する</button>
    </form>
  </section>

  <section class="card">
    <h2>変化グラフ</h2>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chartWrap"></div>
  </section>

  <section class="card">
    <h2>記録一覧</h2>
    <div class="history-list" id="historyList" style="margin-top:10px;"></div>
  </section>
</div>

<script>
(function(){
  var FIELDS = [
    {key:'chestUnder', label:'胸下', short:'胸下'},
    {key:'waist', label:'腹囲', short:'腹囲'},
    {key:'curve', label:'くびれ', short:'くびれ'},
    {key:'lowerAbdomen', label:'下腹', short:'下腹'},
    {key:'hip', label:'ヒップ', short:'ヒップ'}
  ];

  var todayLineEl = document.getElementById('todayLine');
  var storageBanner = document.getElementById('storageBanner');
  var statsBody = document.getElementById('statsBody');
  var fieldsGrid = document.getElementById('fieldsGrid');
  var dateInput = document.getElementById('dateInput');
  var noteInput = document.getElementById('noteInput');
  var editingNote = document.getElementById('editingNote');
  var entryForm = document.getElementById('entryForm');
  var saveBtn = document.getElementById('saveBtn');
  var formMsg = document.getElementById('formMsg');
  var formToast = document.getElementById('formToast');
  var legendEl = document.getElementById('legend');
  var chartWrap = document.getElementById('chartWrap');
  var historyList = document.getElementById('historyList');

  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function fmtLong(s){
    var p = s.split('-');
    return p[0]+'年'+parseInt(p[1],10)+'月'+parseInt(p[2],10)+'日';
  }
  function fmtShort(s){
    var p = s.split('-');
    return parseInt(p[1],10)+'/'+parseInt(p[2],10);
  }

  var visible = {};
  FIELDS.forEach(function(f){ visible[f.key] = true; });
  try{
    var stored = JSON.parse(localStorage.getItem('sizelog_visible')||'null');
    if(stored){ FIELDS.forEach(function(f){ if(f.key in stored) visible[f.key]=!!stored[f.key]; }); }
  }catch(e){}
  function saveVisible(){
    try{ localStorage.setItem('sizelog_visible', JSON.stringify(visible)); }catch(e){}
  }

  // build field inputs
  FIELDS.forEach(function(f){
    var wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.innerHTML =
      '<span class="fieldlabel"><span class="dot" style="background:var(--s-'+f.key+')"></span>'+f.label+'</span>'+
      '<span class="inputline"><input type="number" inputmode="decimal" step="0.1" min="0" max="300" id="f_'+f.key+'"><span class="unit">cm</span></span>';
    fieldsGrid.appendChild(wrap);
  });

  // legend
  FIELDS.forEach(function(f){
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.setAttribute('aria-pressed', visible[f.key] ? 'true':'false');
    chip.innerHTML = '<span class="dot" style="background:var(--s-'+f.key+')"></span>'+f.label;
    chip.addEventListener('click', function(){
      visible[f.key] = !visible[f.key];
      chip.setAttribute('aria-pressed', visible[f.key] ? 'true':'false');
      saveVisible();
      render();
    });
    legendEl.appendChild(chip);
  });

  todayLineEl.textContent = fmtLong(todayStr()) + ' 現在';
  dateInput.value = todayStr();
  dateInput.max = todayStr();

  var docsMap = {}; // date -> data
  var storageAvailable = false;
  var STORAGE_KEY = 'sizelog_entries_v1';

  function loadDocs(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){
      return {};
    }
  }
  function saveDocs(m){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(m));
  }

  function num(v){
    if(v===undefined || v===null || v==='') return null;
    var n = Number(v);
    return isNaN(n) ? null : n;
  }

  function sortedDates(){
    return Object.keys(docsMap).sort();
  }

  function fillFormFromDate(dateStr){
    var d = docsMap[dateStr];
    if(d){
      FIELDS.forEach(function(f){
        var el = document.getElementById('f_'+f.key);
        el.value = (d[f.key]===undefined || d[f.key]===null) ? '' : d[f.key];
      });
      noteInput.value = d.note || '';
      editingNote.classList.add('show');
    } else {
      FIELDS.forEach(function(f){ document.getElementById('f_'+f.key).value = ''; });
      noteInput.value = '';
      editingNote.classList.remove('show');
    }
  }

  dateInput.addEventListener('change', function(){
    fillFormFromDate(dateInput.value);
    formMsg.textContent=''; formToast.textContent='';
  });

  entryForm.addEventListener('submit', function(ev){
    ev.preventDefault();
    formMsg.textContent=''; formToast.textContent='';
    var dateStr = dateInput.value;
    if(!dateStr){ formMsg.textContent = '日付を選択してください。'; return; }
    var data = { date: dateStr };
    var any = false;
    FIELDS.forEach(function(f){
      var v = num(document.getElementById('f_'+f.key).value);
      if(v!==null){ data[f.key] = v; any = true; }
    });
    var note = noteInput.value.trim();
    if(note){ data.note = note; any = true; }
    if(!any){ formMsg.textContent = '少なくとも1項目を入力してください。'; return; }
    if(!storageAvailable){ formMsg.textContent = 'この端末では保存できません（プライベートブラウジング中などが原因の場合があります）。'; return; }
    data.updatedAt = new Date().toISOString();
    try{
      docsMap[dateStr] = data;
      saveDocs(docsMap);
      formToast.textContent = '保存しました。';
      render();
      fillFormFromDate(dateInput.value);
    }catch(e){
      formMsg.textContent = '保存できませんでした。空き容量などをご確認ください。';
    }
  });

  function makeDeleteRow(dateStr){
    var row = document.createElement('div');
    row.className = 'confirm-row';
    row.innerHTML = '<span>'+fmtLong(dateStr)+'の記録を削除しますか？</span><button type="button" class="yes">削除する</button><button type="button" class="no">やめる</button>';
    row.querySelector('.no').addEventListener('click', function(){ row.classList.remove('show'); });
    row.querySelector('.yes').addEventListener('click', function(){
      if(!storageAvailable) return;
      delete docsMap[dateStr];
      try{ saveDocs(docsMap); }catch(e){}
      render();
      fillFormFromDate(dateInput.value);
    });
    return row;
  }

  function renderStats(){
    var dates = sortedDates();
    if(dates.length===0){
      statsBody.innerHTML = '<p class="empty-stats">まだ記録がありません。下のフォームから今日の数値を記録してみましょう。</p>';
      return;
    }
    var latestDate = dates[dates.length-1];
    var prevDate = dates.length>1 ? dates[dates.length-2] : null;
    var latest = docsMap[latestDate];
    var prev = prevDate ? docsMap[prevDate] : null;
    var html = '<p class="eyebrow" style="margin-bottom:8px;">'+fmtLong(latestDate)+'</p><div class="stats">';
    FIELDS.forEach(function(f){
      var v = latest[f.key];
      var deltaHtml = '';
      if(v!==undefined && v!==null){
        if(prev && prev[f.key]!==undefined && prev[f.key]!==null){
          var diff = Math.round((v - prev[f.key])*10)/10;
          if(diff === 0){ deltaHtml = '前回と同じ'; }
          else { deltaHtml = (diff>0?'▲+':'▼')+Math.abs(diff).toFixed(1)+'cm'; }
        } else {
          deltaHtml = '前回データなし';
        }
      }
      html += '<div class="stat"><div class="label"><span class="dot" style="background:var(--s-'+f.key+')"></span>'+f.label+'</div>'+
        '<div class="value">'+ (v===undefined||v===null? '—' : v.toFixed ? v.toFixed(1) : v) + (v!==undefined&&v!==null?'<span class="unit">cm</span>':'') +'</div>'+
        '<div class="delta">'+deltaHtml+'</div></div>';
    });
    html += '</div>';
    statsBody.innerHTML = html;
  }

  function renderHistory(){
    var dates = sortedDates().slice().reverse();
    historyList.innerHTML = '';
    if(dates.length===0){
      historyList.innerHTML = '<p class="empty-history">記録するとここに一覧が表示されます。</p>';
      return;
    }
    dates.forEach(function(dateStr){
      var d = docsMap[dateStr];
      var entry = document.createElement('div');
      entry.className = 'entry';
      var valsHtml = '';
      FIELDS.forEach(function(f){
        if(d[f.key]!==undefined && d[f.key]!==null){
          valsHtml += '<span><span class="k">'+f.short+'</span>'+d[f.key].toFixed(1)+'</span>';
        }
      });
      entry.innerHTML =
        '<div class="edate">'+fmtShort(dateStr)+'</div>'+
        '<div class="evals">'+valsHtml+(d.note?'<div class="enote">'+escapeHtml(d.note)+'</div>':'')+'</div>'+
        '<button type="button" class="edel">削除</button>';
      var delRow = makeDeleteRow(dateStr);
      entry.querySelector('.edel').addEventListener('click', function(){ delRow.classList.toggle('show'); });
      historyList.appendChild(entry);
      historyList.appendChild(delRow);
    });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderChart(){
    var dates = sortedDates();
    var activeFields = FIELDS.filter(function(f){ return visible[f.key]; });
    if(dates.length===0 || activeFields.length===0){
      chartWrap.innerHTML = '<p class="chart-empty">'+(dates.length===0 ? 'データがまだありません。' : '表示する項目を選んでください。')+'</p>';
      return;
    }
    var W = 640, H = 280, padL = 42, padR = 14, padT = 16, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;

    var vals = [];
    dates.forEach(function(dt){
      activeFields.forEach(function(f){
        var v = docsMap[dt][f.key];
        if(v!==undefined && v!==null) vals.push(v);
      });
    });
    if(vals.length===0){
      chartWrap.innerHTML = '<p class="chart-empty">選択中の項目にはまだ数値がありません。</p>';
      return;
    }
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min===max){ min -= 5; max += 5; }
    var pad = (max-min)*0.12;
    min -= pad; max += pad;

    function xAt(i){ return dates.length===1 ? padL + innerW/2 : padL + (i/(dates.length-1))*innerW; }
    function yAt(v){ return padT + innerH - ((v-min)/(max-min))*innerH; }

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';

    var ticks = 4;
    for(var t=0;t<=ticks;t++){
      var gv = min + (max-min)*(t/ticks);
      var gy = yAt(gv);
      svg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(W-padR)+'" y2="'+gy+'" stroke="var(--chart-grid)" stroke-width="1"/>';
      svg += '<text x="'+(padL-8)+'" y="'+gy+'" fill="var(--chart-muted)" font-size="10" text-anchor="end" dominant-baseline="middle" font-family="Karla,sans-serif">'+gv.toFixed(0)+'</text>';
    }

    var idxs = dates.length===1 ? [0] : (dates.length===2 ? [0,1] : [0, Math.floor((dates.length-1)/2), dates.length-1]);
    idxs.forEach(function(i){
      svg += '<text x="'+xAt(i)+'" y="'+(H-8)+'" fill="var(--chart-muted)" font-size="10" text-anchor="middle" font-family="Karla,sans-serif">'+fmtShort(dates[i])+'</text>';
    });

    activeFields.forEach(function(f){
      var d = '';
      var open = false;
      dates.forEach(function(dt,i){
        var v = docsMap[dt][f.key];
        if(v===undefined || v===null){ open = false; return; }
        var x = xAt(i), y = yAt(v);
        d += (open ? ' L ' : 'M ') + x.toFixed(1) + ',' + y.toFixed(1);
        open = true;
      });
      if(d) svg += '<path d="'+d+'" fill="none" stroke="var(--s-'+f.key+')" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
      dates.forEach(function(dt,i){
        var v = docsMap[dt][f.key];
        if(v===undefined || v===null) return;
        svg += '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(v).toFixed(1)+'" r="3.5" fill="var(--s-'+f.key+')"/>';
      });
    });

    svg += '<g id="hoverLayer"></g>';
    svg += '</svg>';
    svg += '<div class="tooltip" id="chartTooltip"></div>';
    chartWrap.innerHTML = svg;

    var svgEl = chartWrap.querySelector('svg');
    var hoverLayer = chartWrap.querySelector('#hoverLayer');
    var tooltip = chartWrap.querySelector('#chartTooltip');

    function showAt(i){
      var dt = dates[i];
      var x = xAt(i);
      var rows = '';
      activeFields.forEach(function(f){
        var v = docsMap[dt][f.key];
        if(v===undefined || v===null) return;
        rows += '<div class="t-row"><span class="dot" style="background:var(--s-'+f.key+')"></span>'+f.short+' '+v.toFixed(1)+'cm</div>';
      });
      if(!rows) return;
      hoverLayer.innerHTML = '<line x1="'+x+'" y1="'+padT+'" x2="'+x+'" y2="'+(H-padB)+'" stroke="var(--chart-muted)" stroke-width="1" stroke-dasharray="2,3"/>';
      tooltip.innerHTML = '<div class="t-date">'+fmtLong(dt)+'</div>'+rows;
      var rect = svgEl.getBoundingClientRect();
      var px = (x/W)*rect.width;
      tooltip.style.left = px + 'px';
      tooltip.style.top = ((padT/H)*rect.height) + 'px';
      tooltip.style.opacity = '1';
    }
    function hide(){ hoverLayer.innerHTML=''; tooltip.style.opacity='0'; }

    function nearestIndex(clientX){
      var rect = svgEl.getBoundingClientRect();
      var relX = ((clientX - rect.left)/rect.width)*W;
      var best = 0, bestD = Infinity;
      dates.forEach(function(dt,i){
        var dx = Math.abs(xAt(i)-relX);
        if(dx<bestD){ bestD=dx; best=i; }
      });
      return best;
    }
    svgEl.addEventListener('mousemove', function(e){ showAt(nearestIndex(e.clientX)); });
    svgEl.addEventListener('mouseleave', hide);
    svgEl.addEventListener('touchstart', function(e){
      if(e.touches[0]) showAt(nearestIndex(e.touches[0].clientX));
    }, {passive:true});
    svgEl.addEventListener('touchmove', function(e){
      if(e.touches[0]) showAt(nearestIndex(e.touches[0].clientX));
    }, {passive:true});
    svgEl.addEventListener('touchend', hide);
  }

  function render(){
    renderStats();
    renderHistory();
    renderChart();
  }

  try{
    localStorage.setItem('sizelog_probe','1');
    localStorage.removeItem('sizelog_probe');
    storageAvailable = true;
    docsMap = loadDocs();
  }catch(e){
    storageBanner.hidden = false;
    storageBanner.textContent = 'この端末では保存機能を使えません（プライベートブラウジング中などが原因の場合があります）。閲覧のみ可能です。';
  }

  render();
  fillFormFromDate(dateInput.value);
})();
</script>
</body>
</html>
